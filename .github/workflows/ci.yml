name: Suite de Integración Continua (CI/CD) & Auditoría Multi-Tenant

on:
  push:
    branches:
      - main
      - reimpelemntacion-del-back
  pull_request:
    branches:
      - main
      - reimpelemntacion-del-back

jobs:
  audit-frontend:
    name: 🎨 Auditoría de Tipos en Front-End (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Instalar Dependencias del Front-End
        run: |
          cd front
          npm ci --legacy-peer-deps

      - name: Verificación Estricta de Compilación TypeScript
        run: |
          cd front
          npx tsc --noEmit --skipLibCheck

  audit-backend:
    name: 🛡️ Suite Maestra de Pruebas Back-End & Teardown DB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: back2/package-lock.json

      - name: Instalar Dependencias del Back-End
        run: |
          cd back2
          npm ci

      - name: Ejecutar Suite de Integración con Teardown de Esquema
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test_jwt_secret_lavanderia_2026' }}
        run: |
          cd back2
          npm run test:clean
